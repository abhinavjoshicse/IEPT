<!doctype html><html><head><meta charset="utf-8"></head><body><script type="module">
// Concept C — "Landscape section": a block of land cut like an architect's model. The road sits in
// its trench, flush with grass; the front face shows every layer. Eco lives in the verges.
import { THREE, LAYERS, setup, layerCanvases, tex, softFloor, done, dark } from './common.js';
const { renderer, scene, camera } = setup();
const cv = layerCanvases();
const W = 16, DEP = 7, RW = 7;
const S = 1.2;
const roadH = LAYERS.slice(1).reduce((a, l) => a + l.h * S, 0);
const soilH = 1.6;
const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };
const soilTex = tex(cv[0], { half: 'side', repeat: [W / 7, 0.9] });
const soil = new THREE.MeshStandardMaterial({ map: soilTex, roughness: 1 });
// subgrade/soil base across the full block
box(W, soilH, DEP, soil, 0, soilH / 2, 0);
// side banks (soil) up to road level, grass on top
const bankW = (W - RW) / 2;
const grass = new THREE.MeshStandardMaterial({ color: dark ? 0x2e5f36 : 0x78b266, roughness: 1 });
[-1, 1].forEach((sx) => {
  box(bankW, roadH, DEP, soil, sx * (RW / 2 + bankW / 2), soilH + roadH / 2, 0);
  box(bankW, 0.08, DEP, grass, sx * (RW / 2 + bankW / 2), soilH + roadH + 0.04, 0);
});
// road layers in the trench
let y = soilH;
LAYERS.slice(1).forEach((L, k) => {
  const i = k + 1, h = L.h * S;
  const side = new THREE.MeshStandardMaterial({ map: tex(cv[i], { half: 'side', repeat: [1, h / 3.5 * 2] }), roughness: 0.9 });
  const top = new THREE.MeshStandardMaterial({ map: tex(cv[i], { half: i === 4 ? 'top' : 'side', repeat: [1, 1] }), roughness: i === 4 ? 0.75 : 0.9 });
  const m = box(RW, h, DEP, [side, side, top, side, side, side], 0, y + h / 2, 0);
  y += h;
});
// a few low-poly shrubs on the verges (the eco touch)
const leaf = new THREE.MeshStandardMaterial({ color: dark ? 0x4f9a5a : 0x5aa25c, roughness: 0.8, flatShading: true });
[[5.6, -1.5, 0.55], [6.6, 1.2, 0.4], [-6.2, -0.4, 0.5], [-5.3, 2.1, 0.32]].forEach(([x, z, s]) => {
  const t = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), leaf); t.position.set(x, soilH + roadH + s * 0.8, z); t.castShadow = true; scene.add(t);
});
softFloor(scene, 0, dark ? '#050b07' : '#dce3d4', 0.55, 6, 16);
camera.position.set(-8.5, 8.2, 15); camera.lookAt(0.6, 1.3, 0);
camera.setViewOffset(innerWidth * 1.4, innerHeight, 0, 0, innerWidth, innerHeight); camera.aspect = innerWidth * 1.4 / innerHeight; camera.updateProjectionMatrix();
done(renderer, scene, camera);
</script></body></html>
