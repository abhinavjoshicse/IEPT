<!doctype html><html><head><meta charset="utf-8"></head><body><script type="module">
// Concept A — "Core sample": a drilled pavement core lifts out of the road and splits into its layers.
import { THREE, LAYERS, setup, layerCanvases, tex, softFloor, done, dark } from './common.js';
const { renderer, scene, camera } = setup();
const cv = layerCanvases();
// road patch with a round hole
const shape = new THREE.Shape(); shape.moveTo(-9, -3.6); shape.lineTo(9, -3.6); shape.lineTo(9, 3.6); shape.lineTo(-9, 3.6); shape.lineTo(-9, -3.6);
const hole = new THREE.Path(); hole.absarc(1.6, 0.2, 1.25, 0, Math.PI * 2, true); shape.holes.push(hole);
const roadGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.45, bevelEnabled: false, curveSegments: 48 });
roadGeo.rotateX(-Math.PI / 2); roadGeo.translate(0, -0.45, 0);
const rt = tex(cv[4], { repeat: [1 / 7, 1 / 3.4] }); rt.offset.set(0.5, 0.52);
const road = new THREE.Mesh(roadGeo, new THREE.MeshStandardMaterial({ map: rt, roughness: 0.8 }));
road.receiveShadow = true; road.castShadow = true; scene.add(road);
// hole wall
const wall = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, 0.45, 48, 1, true), new THREE.MeshStandardMaterial({ color: 0x151515, side: THREE.BackSide, roughness: 1 }));
wall.position.set(1.6, -0.225, 0.2); scene.add(wall);
const floorDisc = new THREE.Mesh(new THREE.CircleGeometry(1.25, 48), new THREE.MeshStandardMaterial({ color: 0x3a2c20, roughness: 1 })); floorDisc.rotation.x = -Math.PI / 2; floorDisc.position.set(1.6, -0.44, 0.2); scene.add(floorDisc);
softFloor(scene, -0.45, dark ? '#050b07' : '#dce3d4', 0.55, 4, 14);
// the core, exploded upward
let y = 0.55;
LAYERS.forEach((L, i) => {
  const h = L.h * 1.35;
  const t = tex(cv[i], { half: 'side', repeat: [1.2, h / 3.5 * 1.8] });
  const top = tex(cv[i], { half: 'side', repeat: [0.35, 0.35] });
  const g = new THREE.CylinderGeometry(1.2, 1.2, h, 64, 1);
  const m = new THREE.Mesh(g, [new THREE.MeshStandardMaterial({ map: t, roughness: 0.9 }), new THREE.MeshStandardMaterial({ map: top, roughness: 0.9 }), new THREE.MeshStandardMaterial({ map: top, roughness: 0.9 })]);
  m.position.set(1.6, y + h / 2, 0.2); m.castShadow = true; m.receiveShadow = true; scene.add(m);
  y += h + 0.16;
});
camera.position.set(-7.5, 6.4, 14.5); camera.lookAt(0.8, 2.0, 0);
camera.setViewOffset(innerWidth * 1.35, innerHeight, 0, 0, innerWidth, innerHeight); camera.aspect = innerWidth * 1.35 / innerHeight; camera.updateProjectionMatrix();
done(renderer, scene, camera);
</script></body></html>
